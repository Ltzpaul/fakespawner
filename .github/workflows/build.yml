name: Build Mod Jar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
            DIR_NAME=$(unzip -qql "$ZIP_FILE" | head -n1 | awk '{print $4}' | cut -d/ -f1)
            if [ -d "$DIR_NAME" ]; then
              cp -r "$DIR_NAME"/* .
            fi
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Jar-File
          path: build/libs/*.jar
